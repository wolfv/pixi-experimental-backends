[workspace]
channels = [
  "https://prefix.dev/pixi-experimental-backends",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]

[package]
name = "buildifier"
version = "7.3.1"
description = "A formatter and linter for Bazel BUILD, WORKSPACE, and .bzl files"
license = "Apache-2.0"

# bazelbuild/buildtools is itself built with Bazel, which makes it a nice
# self-hosting example for the Bazel backend.
[package.build.source]
url = "https://github.com/bazelbuild/buildtools/archive/refs/tags/v7.3.1.tar.gz"

[package.build.backend]
name = "pixi-build-bazel"
version = ">=0.1.0"

[package.build.config]
# Build only what we ship instead of the whole repo (`//...`).
targets = ["//buildifier"]
# Resolve and copy the produced binary into $PREFIX/bin.
install-targets = ["//buildifier"]
extra-args = ["-c", "opt"]
