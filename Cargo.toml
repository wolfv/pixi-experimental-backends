[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["pixi contributors <hi@prefix.dev>"]
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.90"

[workspace.dependencies]
async-trait = "0.1.86"
indexmap = "2.10.0"
miette = "7.6.0"
minijinja = "2.15.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }

pixi_build_backend = { git = "https://github.com/prefix-dev/pixi", rev = "f14af9ea8a5c84ded2255bc41422b1c6a6c11143" }
pixi_build_types = { git = "https://github.com/prefix-dev/pixi", rev = "f14af9ea8a5c84ded2255bc41422b1c6a6c11143" }

rattler_build_jinja = "0.1.14"
rattler_build_recipe = "0.1.14"
rattler_build_types = "0.1.13"
rattler_conda_types = { version = "0.52", default-features = false, features = ["rayon"] }
rattler_digest = { version = "1.3", default-features = false }
rattler_package_streaming = { version = "0.27", default-features = false }
