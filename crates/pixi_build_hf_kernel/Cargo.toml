[package]
description = "Hugging Face kernel build backend for Pixi"
edition.workspace = true
license.workspace = true
name = "pixi_build_hf_kernel"
version = "0.1.3"

[[bin]]
name = "pixi-build-hf-kernel"
path = "src/main.rs"

[features]
default = ["rustls-tls"]
native-tls = ["pixi_build_backend/native-tls", "reqwest/native-tls"]
rustls-tls = ["pixi_build_backend/rustls", "reqwest/rustls-tls"]

[dependencies]
async-trait = { workspace = true }
miette = { workspace = true }
pixi_build_backend = { workspace = true }
pixi_build_types = { workspace = true }
rattler_conda_types = { workspace = true }
rattler_digest = { workspace = true }
rattler_package_streaming = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
